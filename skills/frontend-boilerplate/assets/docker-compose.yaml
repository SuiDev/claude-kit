services:
  web:
    # Playwright は Alpine を公式サポートしないため、品質検証を同一サービスで完結させる目的で公式イメージを使う
    # タグは実行時に npm view @playwright/test version で確認した版に合わせる
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /app
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # ホストとコンテナでネイティブモジュールのバイナリが異なるため、名前付きボリュームで隔離する
      - node_modules:/app/node_modules
    environment:
      # NODE_ENV は指定しない。dev とビルドがそれぞれ適切な値を設定する
      # bind mount ではファイル変更イベントが伝播しないため polling に切り替える
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      # e2e が別コンテナから走る場合に備え、compose ネットワーク上のサービス名で開発サーバーを指す
      BASE_URL: http://web:3000
    tty: true

  # 品質E2Eの計測対象。dev サーバーは HMR と polling の分だけ性能値が汚れるため、本番相当で計測する。
  # verify.sh が起動と停止を管理する（profiles により通常の up -d では起動しない）。
  web-prod:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /app
    command: npm run start
    profiles: ["verify"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    tty: true

volumes:
  node_modules:
